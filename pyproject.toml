[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[project]
name = "innerj"
version = "1.0.0"
description = "What makes a latent variable reach a language model's self-report: a four-condition paradigm and causal toolkit for J-space entry"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Parsa Mazaheri" }]
keywords = [
    "interpretability",
    "mechanistic-interpretability",
    "jacobian-lens",
    "activation-patching",
    "language-models",
]
dependencies = [
    "torch>=2.9",
    "transformers>=5.0",
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "matplotlib>=3.10",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.6"]

[project.scripts]
innerj = "innerj.cli.__main__:main"

[project.urls]
Repository = "https://github.com/parsa-mz/innerj"

[tool.uv.build-backend]
module-name = "innerj"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs real model weights on a GPU"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
